services:
#########################################
#   Setup vue client container
#########################################
  client:
    container_name: ${PROJECT_NAME}-client-${ENV_NAME}
    restart: unless-stopped
    build:
      context: ./client
      dockerfile: dev.DockerFile
    ports:
      - "${VITE_CLIENT_PORT}:${VITE_CLIENT_DOCKER_PORT}"
    environment:
      - VITE_API_BASE_URL=${API_BASE_URL}
      - VITE_CLIENT_DOCKER_PORT=${VITE_CLIENT_DOCKER_PORT}
      - VITE_ENV=${NODE_ENV}
    networks:
      - internal
    volumes:
      - ./client:/usr/src/app
      - client_node_modules:/usr/src/app/node_modules

#########################################
#   Setup express server container
#########################################
  api:
    container_name: ${PROJECT_NAME}-app-${ENV_NAME}
    restart: unless-stopped
    build:
      context: ./server
      dockerfile: DockerFile
      args:
        NODE_ENV: ${NODE_ENV}
        START_METHOD: ${START_METHOD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NODE_API_PORT}:${NODE_API_DOCKER_PORT}"
    environment:
      - SERVICE_NAME=app
      - PROJECT_NAME=${PROJECT_NAME}
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PORT=${DB_PORT}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - OAUTH_SERVER_URL=${OAUTH_SERVER_URL}
      - OAUTH_INTERNAL_URL=${OAUTH_INTERNAL_URL:-}
      - OAUTH_ISSUER=${OAUTH_ISSUER:-}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI}
      - OAUTH_PUBLIC_KEY=${OAUTH_PUBLIC_KEY}
      - START_METHOD=${START_METHOD}
      - CLIENT_ORIGIN=${CLIENT_URL}
      - NODE_API_DOCKER_PORT=${NODE_API_DOCKER_PORT}
      - MAILER_HOST=${MAILER_HOST}
      - MAILER_PORT=${MAILER_PORT}
      - MAILER_SECURE=${MAILER_SECURE}
      - MAILER_USER=${MAILER_USER}
      - MAILER_PASS=${MAILER_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - AI_PROVIDER=${AI_PROVIDER}
      - AI_API_URL=${AI_API_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    #command: ["/usr/wait-for-database.sh", "db:3306", "--", "nodemon", "app.js"]
    volumes:
      - ./server:/usr/src/app
      -  api_node_modules:/usr/src/app/node_modules

#########################################
#   Setup MYSQL container
#########################################
  db:
    container_name: ${DB_HOST}
    image: mysql
    restart: unless-stopped
    ports:
      - '${DB_PORT}:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DEFAULT_AUTH=caching_sha2_password
    volumes:
      - mysql_data:/var/lib/mysql
      - db-config:/etc/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - internal

#########################################
#   Setup Mailpit container
#########################################
  mailpit:
    container_name: ${PROJECT_NAME}-mailpit-${ENV_NAME}
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    restart: unless-stopped
    networks:
      - internal
    # Optional: Define a volume for persistent data if needed
    # volumes:
    #   - mailpit-data:/data

networks:
  internal:
    driver: bridge

volumes:
  mysql_data:
  db-config:
  api_node_modules:
  client_node_modules:
  # mailpit-data: # Ensure this is defined if you uncomment the volume in the mailpit service