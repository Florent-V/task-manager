services:
  #########################################
  #   Setup vue client container
  #########################################
  client:
    container_name: ${PROJECT_NAME}-client-${ENV_NAME}
    restart: unless-stopped
    build:
      context: ./client
      dockerfile: prod.DockerFile
      args:
        VITE_API_BASE_URL: ${API_BASE_URL}
        VITE_CLIENT_DOCKER_PORT: ${VITE_CLIENT_DOCKER_PORT}
        VITE_ENV: ${NODE_ENV}
    ports:
      - "127.0.0.1:${NGINX_CLIENT_PORT}:5050" # accessible uniquement via le reverse proxy du serveur
    environment:
      - VITE_ENV=${NODE_ENV}
      - VITE_API_BASE_URL=${API_BASE_URL}
      - VITE_CLIENT_DOCKER_PORT=${VITE_CLIENT_DOCKER_PORT}
    networks:
#      - web
      - internal
    depends_on:
      - api
#    labels:
#      - "traefik.enable=true"
#      - "traefik.docker.network=web"
#      - "traefik.http.routers.client.rule=Host(`${CLIENT_URL}`)"
#      - "traefik.http.services.client.loadbalancer.server.port=5050"
#      - "traefik.http.routers.client.entrypoints=websecure"
#      - "traefik.http.routers.client.tls.certresolver=${CERT_RESOLVER}"

#########################################
#   Setup express server container
#########################################
  api:
    container_name: ${PROJECT_NAME}-app-${ENV_NAME}
    restart: unless-stopped
    build:
      context: ./server
      dockerfile: DockerFile
      args:
        NODE_ENV: ${NODE_ENV}
        START_METHOD: ${START_METHOD}
        APP_USER: node
    ports:
      - "127.0.0.1:${NODE_API_PORT}:${NODE_API_DOCKER_PORT}" # accessible uniquement via le reverse proxy du serveur
    environment:
      - SERVICE_NAME=app
      - PROJECT_NAME=${PROJECT_NAME}
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - OAUTH_SERVER_URL=${OAUTH_SERVER_URL}
      - OAUTH_INTERNAL_URL=${OAUTH_INTERNAL_URL:-}
      - OAUTH_ISSUER=${OAUTH_ISSUER:-}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI}
      - OAUTH_PUBLIC_KEY=${OAUTH_PUBLIC_KEY}
      - START_METHOD=${START_METHOD}
      - CLIENT_ORIGIN=${CLIENT_URL}
      - NODE_API_DOCKER_PORT=${NODE_API_DOCKER_PORT}
      - MAILER_HOST=${MAILER_HOST}
      - MAILER_PORT=${MAILER_PORT}
      - MAILER_SECURE=${MAILER_SECURE}
      - MAILER_USER=${MAILER_USER}
      - MAILER_PASS=${MAILER_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - AI_PROVIDER=${AI_PROVIDER}
      - AI_API_URL=${AI_API_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
    networks:
#      - web
      - internal
    depends_on:
      db:
        condition: service_healthy
    #command: ["/usr/wait-for-database.sh", "db:3306", "--", "nodemon", "app.js"]
    # Le code et les dépendances viennent de l'image ; seules les données persistantes sont montées
    volumes:
      - ./server/public/uploads:/usr/src/app/public/uploads
      - ./server/logs:/usr/src/app/logs
#    labels:
#      - "traefik.enable=true"
#      - "traefik.docker.network=web"
#      - "traefik.http.routers.api.rule=Host(`${API_BASE_URL}`) && PathPrefix(`/api`)"
#      - "traefik.http.services.api.loadbalancer.server.port=${NODE_API_DOCKER_PORT}"
#      - "traefik.http.routers.api.entrypoints=websecure"
#      - "traefik.http.routers.api.tls.certresolver=${CERT_RESOLVER}"

#########################################
#   Setup MYSQL container
#########################################
  db:
    container_name: ${DB_HOST}
    image: mysql:8.3
    restart: unless-stopped
    ports:
      - '127.0.0.1:${DB_PORT}:3306' # accessible uniquement depuis le serveur (pas depuis l'extérieur)
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - db-config:/etc/mysql
      # - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - internal

networks:
  internal:
    driver: bridge
#  web:
#    external: true

volumes:
  mysql_data:
  db-config:
