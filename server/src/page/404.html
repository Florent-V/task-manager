<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page non trouvée - 404</title>
  <style>
      body {
          margin: 0;
          padding: 0;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          background-color: #f0f0f0;
          font-family: Arial, sans-serif;
      }
      .container {
          text-align: center;
      }
      h1 {
          font-size: 8rem;
          margin: 0;
          color: #ff6347;
          animation: fadeIn 2s ease-in-out;
      }
      p {
          font-size: 1.5rem;
          color: #333;
          animation: fadeIn 2s ease-in-out 0.5s;
      }
      .button {
          margin-top: 20px;
          padding: 15px 30px;
          font-size: 1rem;
          color: #fff;
          background-color: #ff6347;
          border: none;
          border-radius: 5px;
          cursor: pointer;
          animation: fadeIn 2s ease-in-out 1s;
      }
      .button:hover {
          background-color: #ff4500;
      }
      @keyframes fadeIn {
          from {
              opacity: 0;
          }
          to {
              opacity: 1;
          }
      }
  </style>
</head>
<body>
<div class="container">
  <h1>404</h1>
  <p>Oups ! La page que vous cherchez semble introuvable.</p>
  <button class="button" onclick="goBack()">Retour à l'accueil</button>
</div>

<script>
  function goBack() {
    window.location.href = '/';
  }
</script>
</body>
</html>
